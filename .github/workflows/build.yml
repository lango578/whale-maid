name: Build & Release

on:
  workflow_dispatch:        # 可手动触发（填 release_tag 可发布到 Releases）
    inputs:
      release_tag:
        description: '可选：发布到 Releases 的版本号，如 v1.0.0（留空则只构建不发布）'
        required: false
        default: ''
  push:
    branches: [main]        # 推 main 时构建（产物进 Artifacts）
    tags: ['v*']            # 打 v 开头的 tag 时构建并发布到 Releases

permissions:
  contents: write

jobs:
  # ========== 电脑端 exe（Windows）==========
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: pc/electron
        run: npm install --no-fund --no-audit

      - name: Build exe (NSIS + portable)
        working-directory: pc/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-maid-windows-exe
          path: |
            pc/electron/dist/*.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: pc/electron/dist/*.exe
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true

  # ========== 手机端 apk（Ubuntu + Gradle）==========
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (android-36 / build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-maid-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.release_tag }}
          generate_release_notes: true
