<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲸鱼娘·汐汐</title>
<style>
:root{
  --navy:#0b1d33; --navy2:#132a47; --teal:#2bb9c8; --teal2:#64e3ef;
  --bubble:#dff7fb; --ink:#e8f4fb; --ink-dim:#9db8cc; --pink:#ff9eb2;
  --panel:rgba(16,34,58,.82); --panel2:rgba(23,48,80,.72);
  --line:rgba(120,210,230,.22);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei UI","PingFang SC","Segoe UI",sans-serif;
  background:
    radial-gradient(1200px 700px at 78% 8%, rgba(43,185,200,.22), transparent 60%),
    radial-gradient(900px 600px at 12% 92%, rgba(40,90,160,.30), transparent 60%),
    linear-gradient(160deg,#081426 0%, #0b1d33 45%, #0f2b47 100%);
  color:var(--ink); overflow:hidden;
}
/* ===== 顶部栏 ===== */
#topbar{
  height:56px; display:flex; align-items:center; gap:10px; padding:0 14px;
  background:rgba(8,20,38,.75); border-bottom:1px solid var(--line);
  -webkit-app-region:drag; user-select:none;
}
#topbar .logo{font-size:22px}
#topbar .title{font-size:17px; font-weight:700; letter-spacing:1px;
  background:linear-gradient(90deg,#8fe7f2,#5ec4d8,#ffb3c4);
  -webkit-background-clip:text; background-clip:text; color:transparent}
#topbar .sub{font-size:11px; color:var(--ink-dim)}
#status-dot{width:9px;height:9px;border-radius:50%;background:#f5b64c;transition:.3s}
#status-dot.on{background:#4ce39a; box-shadow:0 0 8px #4ce39a}
#topbar .spacer{flex:1}
.tbtn{
  -webkit-app-region:no-drag; cursor:pointer; border:1px solid var(--line);
  background:var(--panel2); color:var(--ink); border-radius:10px; padding:6px 12px;
  font-size:13px; transition:.18s; display:flex; align-items:center; gap:5px;
}
.tbtn:hover{background:rgba(43,185,200,.28); transform:translateY(-1px)}
.tbtn.primary{background:linear-gradient(120deg,#1f93b8,#2bb9c8); border-color:transparent; font-weight:600}
.tbtn.danger{color:#ffc9d3}
/* ===== 主区域 ===== */
#main{display:flex; height:calc(100vh - 56px)}
/* ---- 聊天面板 ---- */
#chatpanel{flex:0 0 58%; min-width:420px; display:flex; flex-direction:column; border-right:1px solid var(--line)}
#chattabs{display:flex; gap:6px; padding:8px 12px 0; font-size:13px}
.chattab{background:transparent; border:none; color:var(--ink-dim); padding:6px 12px; cursor:pointer; border-radius:8px 8px 0 0; border-bottom:2px solid transparent}
.chattab.on{color:#8fe7f2; border-bottom-color:#2bb9c8; font-weight:600}
#messages{flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:82%; display:flex; gap:8px; align-items:flex-end}
.msg .ava{width:34px;height:34px;border-radius:50%;flex:0 0 34px; display:flex;align-items:center;justify-content:center;font-size:18px;
  background:linear-gradient(135deg,#14557a,#2bb9c8); border:1px solid var(--line)}
.msg.me{flex-direction:row-reverse; align-self:flex-end}
.msg.me .ava{background:linear-gradient(135deg,#4a3a75,#a06bd8)}
.bubble{padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; position:relative}
.msg.ai .bubble{background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg.me .bubble{background:linear-gradient(135deg,#2a4a7e,#3a66a8); border-bottom-right-radius:4px}
.msg .time{font-size:10px; color:var(--ink-dim); align-self:center; white-space:nowrap}
.bubble code{background:rgba(0,0,0,.35); padding:1px 5px; border-radius:5px; font-family:Consolas,monospace; font-size:12px}
.thinkbox{margin-top:8px; font-size:12px; color:#8fc9dd; border-left:2px solid #2bb9c8; padding-left:8px; background:rgba(43,185,200,.06); border-radius:0 8px 8px 0}
.thinkbox summary{cursor:pointer; color:#6fb8cf}
.cursor-blink::after{content:"▍"; color:#8fe7f2; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* 输入区 */
#inputbar{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); align-items:flex-end}
#chatinput{
  flex:1; resize:none; height:52px; max-height:140px; border:1px solid var(--line); border-radius:14px;
  background:rgba(10,26,46,.8); color:var(--ink); font-size:14px; padding:12px 14px; font-family:inherit; outline:none; line-height:1.5;
}
#chatinput:focus{border-color:#2bb9c8; box-shadow:0 0 0 3px rgba(43,185,200,.15)}
/* 设置抽屉 */
#drawer{
  position:fixed; inset:56px 0 0 auto; width:340px; transform:translateX(100%); transition:transform .28s ease;
  background:rgba(9,22,40,.96); border-left:1px solid var(--line); padding:20px 18px; overflow-y:auto; z-index:50;
}
#drawer.open{transform:none}
#drawer h3{font-size:15px; margin-bottom:14px; color:#8fe7f2}
#drawer label{display:block; font-size:12px; color:var(--ink-dim); margin:14px 0 6px}
#drawer input[type=text],#drawer input[type=password],#drawer select{
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:rgba(10,26,46,.8); color:var(--ink); font-size:13px; outline:none;
}
#drawer input:focus,#drawer select:focus{border-color:#2bb9c8}
.row{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:8px}
.switch{position:relative; width:44px; height:24px; flex:0 0 44px; cursor:pointer}
.switch input{opacity:0; width:0; height:0}
.switch i{position:absolute; inset:0; background:#22314a; border-radius:20px; transition:.2s}
.switch i::after{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s}
.switch input:checked + i{background:#2bb9c8}
.switch input:checked + i::after{transform:translateX(20px)}
/* ---- 形象面板 ---- */
#avpanel{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; min-width:0}
#avatarWrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; position:relative; padding:8px 12px 0}
#avatarCanvas{width:min(100%,560px); height:auto; cursor:pointer; display:block; filter:drop-shadow(0 10px 24px rgba(20,90,140,.35))}
#speechBubble{
  position:absolute; top:8%; left:50%; transform:translateX(-50%) translateY(-6px);
  max-width:min(72%, 430px); background:rgba(255,255,255,.96); color:#12314f;
  border-radius:16px; padding:10px 14px; font-size:13.5px; line-height:1.6;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#speechBubble.show{opacity:1; transform:translateX(-50%) translateY(0)}
#speechBubble::after{content:""; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-top-color:rgba(255,255,255,.96); border-bottom:none}
#moodline{font-size:12px; color:var(--ink-dim); margin:2px 0 6px; text-align:center}
#quickacts{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0 10px 12px}
.qbtn{border:1px solid var(--line); background:var(--panel2); color:#cfeaf3; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; transition:.18s; display:flex; align-items:center; gap:4px}
.qbtn:hover{background:rgba(43,185,200,.3); transform:translateY(-1px)}
/* ---- 视频/游戏弹窗 ---- */
.modal{position:fixed; inset:0; background:rgba(3,10,22,.82); display:none; align-items:center; justify-content:center; z-index:80}
.modal.open{display:flex}
.modal-box{width:min(880px,94vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.modal-head h3{font-size:16px; color:#8fe7f2}
.modal-box video{width:100%; max-height:52vh; background:#000; border-radius:12px}
.video-tools{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center}
.video-tools input[type=text]{flex:1; min-width:200px; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:rgba(10,26,46,.8); color:var(--ink); outline:none; font-size:13px}
.hint{font-size:12px; color:var(--ink-dim); margin-top:10px; line-height:1.7}
/* 游戏面板 */
#gamebox{display:flex; flex-direction:column; gap:10px}
#gamebox .grow{display:flex; gap:8px}
#gamebox input{flex:1; padding:9px 11px; border-radius:9px; border:1px solid var(--line); background:rgba(10,26,46,.8); color:var(--ink); outline:none; font-size:13px}
#gameresult{display:none; gap:8px}
#gameresult.show{display:flex}
.gstat{font-size:13px; color:#cfeaf3; background:rgba(43,185,200,.1); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
/* 悬浮窗模式（overlay） */
body.overlay{background:transparent; overflow:hidden; pointer-events:none}
body.overlay *{pointer-events:auto}
body.overlay #overlayUI{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:6px}
body.overlay #miniCanvas{width:170px; height:auto; cursor:grab}
body.overlay #oBubble{background:rgba(255,255,255,.95); color:#12314f; border-radius:14px; padding:8px 12px; font-size:12.5px; max-width:300px; line-height:1.5; margin-bottom:2px; opacity:0; transition:.2s; box-shadow:0 6px 18px rgba(0,0,0,.3)}
body.overlay #oBubble.show{opacity:1}
body.overlay .o-close{position:absolute; top:4px; right:6px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.4); color:#fff; border:none; cursor:pointer; font-size:12px; line-height:1}
body.overlay .o-hint{position:absolute; bottom:2px; left:8px; color:rgba(255,255,255,.55); font-size:10px; pointer-events:none}
/* 滚动条 */
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,200,225,.3); border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,200,225,.5)}
::-webkit-scrollbar-track{background:transparent}
@media (max-width:960px){
  #main{flex-direction:column-reverse; overflow-y:auto}
  #chatpanel{flex:none; height:62vh; min-width:0; border-right:none; border-top:1px solid var(--line)}
  #avatarWrap{height:36vh}
}
</style>

/* ---------------- DeepSeek 流式客户端 ---------------- */
async function chatStream(msgs, onDelta, onReason, onDone, onError){
  const isBackend = settings.connMode === 'backend' && settings.backendUrl;
  const url = isBackend
    ? settings.backendUrl + '/api/chat'
    : 'https://api.deepseek.com/chat/completions';
  const headers = { 'Content-Type': 'application/json' };
  if (isBackend){
    if (settings.syncKey) headers['X-Sync-Key'] = settings.syncKey;
  } else {
    headers['Authorization'] = 'Bearer ' + settings.apiKey;
  }
  const body = {
    model: settings.model,
    messages: msgs,
    stream: true,
    max_tokens: 2048
  };
  if (settings.thinking){
    body.thinking = { type: 'enabled' };
    body.reasoning_effort = settings.effort;
  } else {
    body.thinking = { type: 'disabled' };
    body.temperature = settings.temp;
  }
  const resp = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify(body)
  });
  if (!resp.ok){
    let msg = 'HTTP ' + resp.status;
    try { const j = await resp.json(); msg += '：' + ((j.error && j.error.message) || JSON.stringify(j)); }
    catch(e){ msg += ' ' + (await resp.text()).slice(0,200); }
    throw new Error(msg);
  }
  if (!resp.body){
    const j = await resp.json();
    const m = j.choices && j.choices[0] && j.choices[0].message;
    if (m && m.reasoning_content) onReason(m.reasoning_content);
    if (m && m.content) onDelta(m.content);
    onDone(); return;
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  for(;;){
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]'){ onDone(); return; }
      try {
        const j = JSON.parse(data);
        const delta = j.choices && j.choices[0] && j.choices[0].delta;
        if (delta){
          if (delta.reasoning_content) onReason(delta.reasoning_content);
          if (delta.content) onDelta(delta.content);
        }
      } catch(e){ /* 忽略坏行 */ }
    }
  }
  onDone();
}

function drawFace(ctx, t){
  const mood = AV.mood;
  const blink = AV.blinkT > 0.08;

  ctx.save();
  ctx.translate(0, bob*0.3);

  ctx.strokeStyle = '#2a5a78'; ctx.lineWidth = 2; ctx.lineCap='round';
  if (mood==='angry'){
    ctx.beginPath(); ctx.moveTo(116,156); ctx.lineTo(136,164); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(120,158); ctx.quadraticCurveTo(130,152,140,156); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(180,158); ctx.quadraticCurveTo(170,152,160,156); ctx.stroke();
  }

  const eyeShift = mood==='think' ? {x:2, y:-3} : {x:0, y:0};
  drawEye(ctx, 130+eyeShift.x, 190+eyeShift.y, mood, blink);
  drawEye(ctx, 170+eyeShift.x, 190+eyeShift.y, mood, blink);

  const blushA = (mood==='blush'||mood==='happy'||mood==='shy') ? 0.55 : 0.26;

  }

  ctx.strokeStyle = '#b0526a'; ctx.lineWidth = 2.2; ctx.lineCap='round';
  const my = 218;
  if (AV.speaking){
    const m = 3 + Math.abs(Math.sin(AV.mouthT*10))*3;
    ctx.fillStyle = '#a3445e';
    ctx.beginPath(); ctx.ellipse(150, my+2, 5.5, m, 0, 0, Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.arc(150, my+7, 6, Math.PI*1.15, Math.PI*1.85); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(144,my+1); ctx.quadraticCurveTo(150,my+5,156,my+1); ctx.stroke();
  } else if (mood==='think'){
    for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(144+i*6, my+2, 1.5, 0, Math.PI*2); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.arc(150, my-2, 5.5, Math.PI*0.2, Math.PI*0.8); ctx.stroke();

}

function renderAvatar(ctx, W, H, t, isMini){
  const s = W/300;
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.scale(s,s);
  if (!isMini){
    const g = ctx.createRadialGradient(150,300,10,150,300,220);
    g.addColorStop(0,'rgba(43,185,200,.12)'); g.addColorStop(1,'rgba(43,185,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,300,460);
  }
  drawBubbles(ctx,t);
  drawShadow(ctx,t);
  let offsetY=0, squash=1;
  if (AV.anim && AV.anim.type==='bounce'){
    const f = AV.anim.t/AV.anim.dur;
    offsetY = -Math.sin(Math.min(1,f)*Math.PI)*10;
    squash = 1 - Math.sin(Math.min(1,f)*Math.PI)*0.06;
  }
  ctx.save();
  ctx.translate(150,0); ctx.scale(2-squash, squash); ctx.translate(-150,0);
  ctx.translate(0, offsetY);
  if (persona === 'shark'){
    drawSharkTail(ctx,t);
    drawSharkDress(ctx,t);
    drawArms(ctx,t);
    drawSharkHeadParts(ctx,t);
  } else {
    drawTail(ctx,t);
    drawDress(ctx,t);
    drawArms(ctx,t);
    drawHeadParts(ctx,t);
  }
  ctx.restore();
  ctx.restore();
}

function startAvatar(){
  const main = document.getElementById('avatarCanvas');
  const mini = document.getElementById('miniCanvas');
  const ctxM = main ? main.getContext('2d') : null;
  const ctxI = mini ? mini.getContext('2d') : null;
  let last = performance.now(), t = 0;
  function frame(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now; t += dt;
    // 眨眼计时
    AV.blinkT = Math.max(0, AV.blinkT - dt);
    if (AV.blinkT <= 0){
      if (AV.lastBlink <= 0){ AV.blinkT = 0.14; AV.lastBlink = 2.4 + Math.random()*2.6; }
      else AV.lastBlink -= dt;
    }
    AV.mouthT += dt;
    if (ctxM) renderAvatar(ctxM, main.width, main.height, t, false);
    if (ctxI) renderAvatar(ctxI, mini.width, mini.height, t, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function personaName(){ return persona === 'shark' ? '澜澜' : '汐汐'; }

function togglePersona(){
  persona = persona === 'whale' ? 'shark' : 'whale';
  try { localStorage.setItem('wm_persona', persona); } catch(e){}
  $('#btn-persona').textContent = persona === 'whale' ? '🐳 汐汐' : '🦈 澜澜';
  AV.mood = 'idle';
  AV.anim = null;
  const msg = persona === 'whale'
    ? '（人格切换为鲸鱼娘·汐汐）呜噜噜～主人好呀！今天要聊天、打游戏还是看视频？'

/* ---- 云端同步（需后台模式） ---- */
async function syncFromCloud(){
  if (!settings.backendUrl){ toast('主人～先在设置里填后端地址和同步口令哦'); return; }
  try {
    const headers = {};
    if (settings.syncKey) headers['X-Sync-Key'] = settings.syncKey;
    const res = await fetch(settings.backendUrl + '/api/state', { headers });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (Array.isArray(data.history)){
      history = data.history;
      $('#messages').innerHTML = '';
      history.forEach(m => addMsg(m.role, m.content));
    }
    if (data.persona === 'whale' || data.persona === 'shark'){
      persona = data.persona;
      try { localStorage.setItem('wm_persona', persona); } catch(e){}
      $('#btn-persona').textContent = persona === 'whale' ? '🐳 汐汐' : '🦈 澜澜';
    }
    toast('✅ 已从云端拉取（历史 ' + (history.length) + ' 条）');
  } catch(e){ toast('拉取失败：' + e.message); }
}

async function syncToCloud(){
  if (!settings.backendUrl){ toast('主人～先在设置里填后端地址和同步口令哦'); return; }
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (settings.syncKey) headers['X-Sync-Key'] = settings.syncKey;
    const res = await fetch(settings.backendUrl + '/api/state', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        history: history.slice(-80),
        persona,
        settings: { model: settings.model, thinking: settings.thinking, effort: settings.effort, temp: settings.temp }
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    toast('✅ 已同步到云端（' + history.slice(-80).length + ' 条）');
  } catch(e){ toast('同步失败：' + e.message); }
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function interact(zone){
  const moodMap = { head:'happy', cheek:'blush', tail:'shy', giggle:'happy' };
  const animMap = { head:'bounce', cheek:'mood', tail:'wiggle', giggle:'mood' };
  AV.setMood(moodMap[zone]);
  AV.setAnim(animMap[zone], 1.1);
  const lines = persona === 'shark' ? CANNED_SHARK : CANNED;
  const line = pick(lines[zone]);
  bubble(line, 3600);
  if (IS_ELECTRON && window.whalemaid) window.whalemaid.overlaySpeak(line);
  setTimeout(()=>{ if (AV.mood===moodMap[zone]) AV.mood='idle'; }, 4200);
}

function canvasPos(ev, canvas){
  const r = canvas.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * 300;
  const y = (ev.clientY - r.top) / r.height * 460;
  return {x, y};
}
function hitZone(p){
  if (Math.hypot(p.x-150,p.y-182) < 74) return 'head';
  if (Math.hypot(p.x-110,p.y-204) < 28 || Math.hypot(p.x-190,p.y-204) < 28) return 'cheek';
  if (p.y > 372) return 'tail';
  return 'giggle';
}

function askWhaleSpeak(){
  if (busy) return;
  const prompt = '（主人戳了戳汐汐，想让汐汐主动说句话～）';
  $('#chatinput').value = prompt;
  sendUser(prompt);
}
/* ---- 语音输入 ---- */
let recognition = null;
function setupVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ $('#btn-voice').title = '此浏览器不支持语音输入'; return; }
  recognition = new SR();
  recognition.lang = 'zh-CN'; recognition.interimResults = false;
  recognition.onresult = e => {
    const t = e.results[0][0].transcript;
    $('#chatinput').value = ($('#chatinput').value ? $('#chatinput').value + ' ' : '') + t;
  };
  recognition.onerror = () => toast('语音识别失败，换个安静点的环境试试～');
  $('#btn-voice').addEventListener('click', () => {
    if (busy) return;
    try { recognition.start(); toast('🎤 在听呢，请说话…'); }
    catch(e){ toast('麦克风不可用或正在识别中'); }
  });
}

/* ---- 设置抽屉 ---- */
function openDrawer(){ $('#drawer').classList.add('open'); fillDrawer(); }
function fillDrawer(){
  $('#set-key').value = settings.apiKey;
  $('#set-model').value = settings.model;
  $('#set-think').checked = settings.thinking;
  $('#set-effort').value = settings.effort;
  $('#set-temp').value = settings.temp;
  $('#set-anim').checked = settings.anim;
  $('#set-mem').checked = settings.memory;
  $('#set-conn').value = settings.connMode;
  $('#set-backend').value = settings.backendUrl;
  $('#set-sync').value = settings.syncKey;
}

/* ---- 模式切换 ---- */
function setMode(m){
  curMode = m;
  $$('.chattab').forEach(t => t.classList.toggle('on', t.dataset.mode === m));
  $('#modeNow').textContent = m==='chat' ? '日常' : (m==='game' ? '陪玩' : '陪看');
}

/* ---- 陪玩游戏 ---- */
function startGame(){
  const name = $('#gameName').value.trim();
  if (!name){ toast('告诉汐汐你在玩什么嘛～'); return; }
  currentGame = name;
  $('#gameresult').classList.add('show');
  refreshGameState();
  sendUser(`（开始陪玩）我们开始玩《${name}》啦，汐汐给我点开局鼓励吧！`);
}
function refreshGameState(){
  $('#gameState').textContent = `正在陪主人玩《${currentGame||'?'}》 · 胜 ${gameWin} 负 ${gameLose}`;
}
function gameResult(win){
  if (!currentGame){ toast('先告诉汐汐你在玩什么游戏哦'); return; }
  if (win){ gameWin++; sendUser(`（赢了）刚打完《${currentGame}》赢啦！汐汐快跟我一起庆祝！`); }
  else { gameLose++; sendUser(`（输了）刚打完《${currentGame}》输了…汐汐安慰安慰我，顺便分析下怎么赢回来`); }
  refreshGameState();
}

/* ---- 陪看视频 ---- */
function embedFrame(src){
  const holder = $('#videoPlayer').parentNode;
  const ifr = document.createElement('iframe');
  ifr.src = src; ifr.style.cssText = 'width:100%;height:52vh;border:none;border-radius:12px';
  $('#videoPlayer').style.display = 'none';
  holder.appendChild(ifr);
  holder._iframe = ifr;
}
function restoreVideo(){
  const holder = $('#videoPlayer').parentNode;
  if (holder._iframe){ holder._iframe.remove(); holder._iframe = null; }
  $('#videoPlayer').style.display = '';
}
function loadVideo(url, name){
  restoreVideo();
  const v = $('#videoPlayer');
  v.src = url; v.play().catch(()=>{});
  toast('🎬 开始和汐汐一起看啦！记得给汐汐讲讲剧情哦');
  setMode('watch');
}
function parseUrl(v){
  if (/(bilibili|b23\.tv)/i.test(v)){
    const bv = v.match(/BV[0-9A-Za-z]+/);
    if (bv) return {embed: 'https://player.bilibili.com/player.html?bvid=' + bv[0]};
    return null;
  }
  if (/(youtube|youtu\.be)/i.test(v)){
    const id = v.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
    if (id) return {embed: 'https://www.youtube.com/embed/' + id[1]};
    return null;
  }
  return {direct: v};
}

/* ---- 桌面悬浮窗 ---- */
function openOverlay(){
  if (!IS_ELECTRON){ toast('悬浮窗需要 Electron 桌面版哦～'); return; }
  window.whalemaid.openOverlay();
  toast('✨ 悬浮窗已开启！可拖到游戏画面旁，Ctrl+Shift+O 切换鼠标穿透');
}
/* ---- 初始化 ---- */
function init(){
  if (settings.memory){
    try { const h = JSON.parse(localStorage.getItem('wm_history') || '[]'); history = Array.isArray(h) ? h : []; } catch(e){}
  }
  history.forEach(m => addMsg(m.role, m.content));
  if (!history.length) addMsg('assistant', '呜噜噜～欢迎回来，主人！我是女仆鲸鱼娘汐汐🐳。想聊天、打游戏还是看视频，汐汐都陪你～');

  $('#btn-send').addEventListener('click', () => sendUser());
  $('#chatinput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendUser(); }
  });
  $('#btn-settings').addEventListener('click', openDrawer);
  $('#btn-close-drawer').addEventListener('click', () => $('#drawer').classList.remove('open'));
  $('#btn-save').addEventListener('click', () => { saveSettings(); $('#drawer').classList.remove('open'); toast('已保存～'); });
  $('#btn-clear').addEventListener('click', () => { if (confirm('确定清空对话吗？')) clearChat(); });

  // 人格切换 + 云端同步
  $('#btn-persona').textContent = persona === 'whale' ? '🐳 汐汐' : '🦈 澜澜';
  $('#btn-persona').addEventListener('click', togglePersona);
  $('#btn-sync-pull').addEventListener('click', syncFromCloud);
  $('#btn-sync-push').addEventListener('click', syncToCloud);

  // 模式
  $$('.chattab').forEach(t => t.addEventListener('click', () => {
    const m = t.dataset.mode;
    if (m === 'game'){ setMode('game'); $('#gameModal').classList.add('open'); }
    else if (m === 'watch'){ setMode('watch'); $('#videoModal').classList.add('open'); }
    else setMode('chat');
  }));
  $('#btn-game').addEventListener('click', () => { setMode('game'); $('#gameModal').classList.add('open'); });
  $('#btn-video').addEventListener('click', () => { setMode('watch'); $('#videoModal').classList.add('open'); });
  $('#btn-close-game').addEventListener('click', () => $('#gameModal').classList.remove('open'));
  $('#btn-close-video').addEventListener('click', () => { $('#videoModal').classList.remove('open'); restoreVideo(); });
  $('#btn-game-start').addEventListener('click', startGame);
  $('#btn-win').addEventListener('click', () => gameResult(true));
  $('#btn-lose').addEventListener('click', () => gameResult(false));
  $('#btn-change').addEventListener('click', () => { currentGame = null; $('#gameName').value=''; $('#gameresult').classList.remove('show'); refreshGameState(); toast('换什么游戏呀？告诉汐汐～'); });
  $('#btn-game-overlay').addEventListener('click', openOverlay);

  // 视频
  $('#btn-load-local').addEventListener('click', () => $('#videoFile').click());
  $('#videoFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    loadVideo(URL.createObjectURL(f), f.name);
  });
  $('#btn-load-url').addEventListener('click', () => {
    const v = $('#videoUrl').value.trim();
    if (!v) return;
    const r = parseUrl(v);
    if (!r){ toast('无法解析这个链接呢～'); return; }
    if (r.embed){ restoreVideo(); embedFrame(r.embed); setMode('watch'); toast('🎬 已加载嵌入式播放器，一起看！'); }
    else loadVideo(r.direct, v);
  });

  // 形象互动
  $('#avatarCanvas').addEventListener('click', e => interact(hitZone(canvasPos(e, $('#avatarCanvas')))));
  $$('.qbtn').forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.act;
    if (act === 'ai') askWhaleSpeak(); else interact(act);
  }));
  $('#btn-overlay').addEventListener('click', openOverlay);

  setupVoice();

  setInterval(() => {
    if (!busy && Math.random() < 0.55){
      const lines = persona === 'shark' ? CANNED_SHARK : CANNED;
      const l = pick(lines.idle);
      bubble(l, 4200);
      if (IS_ELECTRON && window.whalemaid) window.whalemaid.overlaySpeak(l);
    }
  }, 45000);

  startAvatar();
}

/* ---- 悬浮窗独立页 ---- */
if (IS_OVERLAY){
  document.body.classList.add('overlay');
  $('#overlayUI').style.display = 'flex';
  $('#topbar').style.display = 'none';
  $('#main').style.display = 'none';
  const mini = $('#miniCanvas');
  mini.addEventListener('mousedown', () => { if (window.whalemaid) window.whalemaid.dragStart(); });
  window.addEventListener('mouseup', () => { if (window.whalemaid) window.whalemaid.dragEnd(); });
  mini.addEventListener('click', e => interact(hitZone(canvasPos(e, mini))));
  $('#o-close').addEventListener('click', () => window.whalemaid && window.whalemaid.closeOverlay());
  if (window.whalemaid && window.whalemaid.onOverlaySpeak){
    window.whalemaid.onOverlaySpeak(t => {
      const b = $('#oBubble'); b.textContent = t; b.classList.add('show');
      clearTimeout(window._obt); window._obt = setTimeout(() => b.classList.remove('show'), 6000);
    });
  }
  window.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'O'){
      if (window.whalemaid) window.whalemaid.toggleClickThrough();
    }
  });
  startAvatar();
} else {
  document.addEventListener('DOMContentLoaded', init);
}
</script>
