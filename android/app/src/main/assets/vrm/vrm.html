<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>
<style>
html,body{margin:0;padding:0;height:100%;background:transparent;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#hint{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:12px;color:#9db8cc;font-family:sans-serif}
</style>
</head>
<body>
<div id="hint"></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';

let vrm=null, clock=new THREE.Clock(), moodTimer=null;
let vrmAction=null, nextBlink=0, blinkOn=0;

function playAction(zone){
  vrmAction={ type:zone, start:performance.now(), dur:1.3 };
}

function applyAction(now){
  if(!vrmAction || !vrm || !vrm.humanoid) return false;
  const p=Math.min(1,(now-vrmAction.start)/1000/vrmAction.dur);
  const e=1-Math.pow(1-p,3);
  const hum=vrm.humanoid;
  const head=hum.getNormalizedBoneNode('head');
  const spine=hum.getNormalizedBoneNode('spine');
  const hips=hum.getNormalizedBoneNode('hips');
  const ur=hum.getNormalizedBoneNode('rightUpperArm');
  const ul=hum.getNormalizedBoneNode('leftUpperArm');
  const type=vrmAction.type;
  if(type==='head'){ if(head) head.rotation.x=-0.28*e; if(spine) spine.rotation.x=0.1*e; }
  else if(type==='cheek'){ if(head) head.rotation.z=-0.22*e; }
  else if(type==='tail'){
    vrm.scene.position.y=Math.abs(Math.sin(p*Math.PI*3))*0.3*(1-p);
    if(hips) hips.rotation.y=Math.sin(p*Math.PI*2)*0.5*(1-p);
  }
  else if(type==='wave'){ if(ur) ur.rotation.z=-2.4*e; if(ul) ul.rotation.z=-2.4*e; if(head) head.rotation.x=0.15*e; }
  else if(type==='giggle'){ if(head) head.rotation.z=Math.sin(p*Math.PI*3)*0.15*(1-p); if(spine) spine.rotation.z=Math.sin(p*Math.PI*3)*0.06*(1-p); }
  else if(type==='body'){ if(hips) hips.rotation.x=0.15*e; }
  if(p>=1){ vrmAction=null; return false; }
  return true;
}

function autoBlink(now){
  if(!vrm || !vrm.expressionManager) return;
  const em=vrm.expressionManager;
  if(blinkOn>0){
    if(now>blinkOn){ blinkOn=0; try{ em.setValue('blink',0); }catch(e){} }
  } else if(now>=nextBlink){
    try{ em.setValue('blink',1); }catch(e){}
    blinkOn=now+150; nextBlink=now+1800+Math.random()*3500;
  }
}
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'), alpha:true, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const camera=new THREE.PerspectiveCamera(28, window.innerWidth/window.innerHeight, 0.1, 20);
camera.position.set(0,1.25,2.6);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x446688,0.95));
const key=new THREE.DirectionalLight(0xffffff,1.25); key.position.set(0.6,1.4,1.2); scene.add(key);
const rim=new THREE.DirectionalLight(0x9fd7ff,0.6); rim.position.set(-0.8,0.9,-1.0); scene.add(rim);
const fill=new THREE.DirectionalLight(0x88ccee,0.35); fill.position.set(0,0.4,-1.6); scene.add(fill);

function resize(){ renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

function loadVrm(url){
  const hint=document.getElementById('hint');
  hint.textContent='🔄 正在加载 3D 模型…';
  const loader=new GLTFLoader();
  loader.register(parser=>new VRMLoaderPlugin(parser));
  loader.load(url, gltf=>{
    const m=gltf.userData && gltf.userData.vrm;
    if(!m){ hint.textContent='⚠️ 不是有效的 VRM 模型'; window.WhaleMaid && window.WhaleMaid.onError('not vrm'); return; }
    if(vrm) scene.remove(vrm.scene);
    vrm=m; scene.add(vrm.scene);
    try{
      const box=new THREE.Box3().setFromObject(vrm.scene);
      const h=Math.max(box.getSize(new THREE.Vector3()).y,1.2);
      camera.position.set(0, h*1.02, h*2.1); camera.lookAt(0, h*0.5, 0);
    }catch(e){}
    hint.textContent='';
    window.WhaleMaid && window.WhaleMaid.onReady();
  }, undefined, err=>{ hint.textContent='⚠️ 模型加载失败'; window.WhaleMaid && window.WhaleMaid.onError(String(err)); });
}

const params=new URLSearchParams(location.search);
const file=params.get('file');
if(file) loadVrm('/files/'+file);

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(vrm){
    try{ vrm.update(dt); }catch(e){}
    const now=performance.now();
    const acting=applyAction(now);
    if(!acting){
      const t=now/1000;
      if(vrm.humanoid){
        const hips=vrm.humanoid.getNormalizedBoneNode('hips');
        if(hips) hips.rotation.z=Math.sin(t*1.6)*0.012;
        const head=vrm.humanoid.getNormalizedBoneNode('head');
        if(head){ head.rotation.z=Math.sin(t*0.8)*0.02; head.rotation.x=Math.sin(t*0.5)*0.012; }
      }
      vrm.scene.position.y=Math.sin(t*1.2)*0.02;
    }
    autoBlink(now);
  }
  renderer.render(scene,camera);
}
animate();

window.setVrmMood=function(zone){
  if(!vrm || !vrm.expressionManager) return;
  const em=vrm.expressionManager;
  const names=['happy','joy','relaxed','blink','blinkL','blinkR','blush','shy','angry','sad'];
  for(const n of names){ try{ em.setValue(n,0); }catch(e){} }
  const map={head:'happy', cheek:'blush', tail:'shy', giggle:'happy'};
  const name=map[zone];
  if(name){ try{ em.setValue(name,1); }catch(e){} }
  if(moodTimer) clearTimeout(moodTimer);
  moodTimer=setTimeout(()=>{ for(const n of names){ try{ em.setValue(n,0); }catch(e){} } },4200);
};

document.getElementById('c').addEventListener('click', e=>{
  const r=e.target.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  let zone='giggle';
  if(y<0.30) zone='head';
  else if(y<0.52 && (x<0.30||x>0.70)) zone='cheek';
  else if(y>0.82) zone='tail';
  window.setVrmMood(zone);
  window.playAction(zone);
  if(window.WhaleMaid) window.WhaleMaid.onHit(zone);
});
</script>
</body>
</html>
